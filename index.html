<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Floor Mapper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-0:#081222;
    --navy-1:#0B1B30;
    --navy-2:#102544;
    --panel:#0F2340;
    --grid:rgba(91,155,213,0.10);
    --grid-strong:rgba(91,155,213,0.22);
    --ink:#C9D8E8;
    --ink-dim:#7E97B2;
    --ink-faint:#4C6280;
    --line:#5B9BD5;
    --line-dim:#2E5A85;
    --orange:#FF5A1F;
    --orange-dim:#8C3413;
    --border:#1E3A5C;
    --border-soft:#152C48;
    --danger:#E24B4A;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      linear-gradient(var(--grid) 1px, transparent 1px) 0 0/28px 28px,
      linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0/28px 28px,
      var(--navy-0);
    color:var(--ink);
    font-family:'IBM Plex Mono', monospace;
    min-height:100vh;
    -webkit-tap-highlight-color:transparent;
  }
  .wrap{
    max-width:560px;
    margin:0 auto;
    padding:20px 16px 60px;
    position:relative;
  }
  .reg-mark{
    position:absolute;
    width:22px; height:22px;
    pointer-events:none;
    opacity:0.55;
  }
  .reg-mark svg{width:100%;height:100%;display:block;}
  .reg-tl{ top:10px; left:6px; }
  .reg-tr{ top:10px; right:6px; }

  header{
    text-align:center;
    padding:18px 0 14px;
    border-bottom:1px solid var(--border);
    margin-bottom:16px;
  }
  h1{
    font-family:'Oswald', sans-serif;
    font-weight:700;
    font-size:26px;
    letter-spacing:3px;
    margin:0;
    color:var(--ink);
    text-transform:uppercase;
  }
  h1 span{color:var(--orange);}
  .subtitle{
    font-size:11px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--ink-dim);
    margin-top:6px;
  }

  .mode-toggle{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:8px;
    margin-bottom:14px;
  }
  .mode-btn{
    font-family:'Oswald', sans-serif;
    font-weight:600;
    letter-spacing:2px;
    text-transform:uppercase;
    font-size:14px;
    padding:16px 8px;
    background:var(--panel);
    border:1px solid var(--border);
    color:var(--ink-dim);
    border-radius:2px;
    cursor:pointer;
    transition:background 0.15s, color 0.15s, border-color 0.15s;
  }
  .mode-btn.active{
    background:var(--orange);
    border-color:var(--orange);
    color:#1A0A03;
  }
  .mode-btn:not(.active):active{ background:var(--navy-2); }

  .floor-tabs{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:6px;
    margin-bottom:18px;
  }
  .floor-tab{
    background:var(--navy-1);
    border:1px solid var(--border-soft);
    color:var(--ink-dim);
    border-radius:2px;
    padding:10px 4px 8px;
    cursor:pointer;
    text-align:center;
    font-family:'IBM Plex Mono', monospace;
  }
  .floor-tab .fnum{
    font-family:'Oswald', sans-serif;
    font-size:18px;
    font-weight:600;
    display:block;
    color:var(--ink);
  }
  .floor-tab .fcount{
    font-size:10px;
    letter-spacing:1px;
    color:var(--ink-faint);
    display:block;
    margin-top:2px;
  }
  .floor-tab.active{
    border-color:var(--line);
    background:var(--navy-2);
  }
  .floor-tab.active .fnum{ color:var(--line); }
  .floor-tab.active .fcount{ color:var(--line-dim); }

  .panel{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:3px;
    padding:16px;
    margin-bottom:14px;
  }
  .field-label{
    font-size:10px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--ink-dim);
    margin-bottom:6px;
    display:block;
  }
  .field{ margin-bottom:14px; }
  .field:last-child{ margin-bottom:0; }
  input[type=text], input[type=number]{
    width:100%;
    background:var(--navy-0);
    border:1px solid var(--border);
    color:var(--ink);
    font-family:'IBM Plex Mono', monospace;
    font-size:20px;
    padding:14px 12px;
    border-radius:2px;
    outline:none;
  }
  input[type=text]:focus, input[type=number]:focus{
    border-color:var(--line);
  }
  .start-note{
    background:var(--navy-0);
    border:1px dashed var(--line-dim);
    color:var(--line);
    font-size:12px;
    letter-spacing:1px;
    text-transform:uppercase;
    padding:12px;
    border-radius:2px;
    text-align:center;
  }
  .add-btn{
    width:100%;
    margin-top:16px;
    background:var(--orange);
    border:none;
    color:#1A0A03;
    font-family:'Oswald', sans-serif;
    font-weight:700;
    font-size:16px;
    letter-spacing:2px;
    text-transform:uppercase;
    padding:16px;
    border-radius:2px;
    cursor:pointer;
  }
  .add-btn:disabled{
    background:var(--orange-dim);
    color:#4A2A18;
    cursor:not-allowed;
  }
  .add-btn:not(:disabled):active{ transform:scale(0.98); }

  .log-title{
    font-size:10px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--ink-dim);
    margin:20px 0 8px;
  }
  .log-row{
    display:flex;
    align-items:center;
    gap:10px;
    padding:12px 4px;
    border-bottom:1px solid var(--border-soft);
  }
  .log-row .seq{
    font-family:'Oswald', sans-serif;
    font-size:13px;
    color:var(--ink-faint);
    width:22px;
    flex-shrink:0;
  }
  .log-row .rinfo{ flex:1; min-width:0; }
  .log-row .rname{
    font-size:15px;
    color:var(--ink);
    font-weight:500;
  }
  .log-row .rsteps{
    font-size:11px;
    color:var(--line-dim);
    margin-top:2px;
  }
  .del-btn{
    background:none;
    border:1px solid var(--border);
    color:var(--ink-faint);
    width:32px; height:32px;
    border-radius:2px;
    cursor:pointer;
    font-size:16px;
    line-height:1;
    flex-shrink:0;
  }
  .del-btn:active{ border-color:var(--danger); color:var(--danger); }

  .empty-state{
    text-align:center;
    color:var(--ink-faint);
    font-size:12px;
    letter-spacing:1px;
    padding:30px 10px;
  }

  .map-legend{
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-size:10px;
    letter-spacing:1px;
    text-transform:uppercase;
    color:var(--ink-faint);
    margin-bottom:10px;
  }
  .map-legend .scale-line{
    display:inline-block;
    width:26px;
    border-top:2px dashed var(--line-dim);
    margin-right:6px;
    vertical-align:middle;
  }
  .map-scroll{
    overflow-x:auto;
    overflow-y:hidden;
    border:1px solid var(--border);
    border-radius:3px;
    background:
      linear-gradient(var(--grid-strong) 1px, transparent 1px) 0 0/20px 20px,
      linear-gradient(90deg, var(--grid-strong) 1px, transparent 1px) 0 0/20px 20px,
      var(--navy-1);
  }
  .loading{
    text-align:center;
    color:var(--ink-faint);
    font-size:12px;
    letter-spacing:2px;
    padding:40px 0;
  }
  .err{
    color:var(--danger);
    font-size:11px;
    text-align:center;
    padding:8px 0 0;
  }
  .reset-row{
    text-align:center;
    margin-top:24px;
  }
  .reset-link{
    background:none;
    border:none;
    color:var(--ink-faint);
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:1px;
    text-decoration:underline;
    cursor:pointer;
    padding:8px;
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="reg-mark reg-tl"><svg viewBox="0 0 24 24"><line x1="12" y1="0" x2="12" y2="24" stroke="#5B9BD5" stroke-width="1"/><line x1="0" y1="12" x2="24" y2="12" stroke="#5B9BD5" stroke-width="1"/><circle cx="12" cy="12" r="6" fill="none" stroke="#5B9BD5" stroke-width="1"/></svg></div>
  <div class="reg-mark reg-tr"><svg viewBox="0 0 24 24"><line x1="12" y1="0" x2="12" y2="24" stroke="#5B9BD5" stroke-width="1"/><line x1="0" y1="12" x2="24" y2="12" stroke="#5B9BD5" stroke-width="1"/><circle cx="12" cy="12" r="6" fill="none" stroke="#5B9BD5" stroke-width="1"/></svg></div>

  <header>
    <h1>FLOOR<span>·</span>MAPPER</h1>
    <div class="subtitle">wayfinding survey tool</div>
  </header>

  <div class="mode-toggle">
    <button class="mode-btn active" id="btnRecord">Record</button>
    <button class="mode-btn" id="btnMap">Map</button>
  </div>

  <div class="floor-tabs" id="floorTabs"></div>

  <div id="content"><div class="loading">LOADING SURVEY DATA&hellip;</div></div>

  <div class="reset-row">
    <button class="reset-link" id="resetBtn">clear this floor's data</button>
  </div>
</div>

<script>
(function(){
  var FLOORS = [1,2,3,4];
  var state = {
    mode: 'record',
    floor: 1,
    data: {1:[], 2:[], 3:[], 4:[]},
    loaded: false
  };

  function keyFor(floor){ return 'rooms-floor-' + floor; }

  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

  async function loadAll(){
    for (var i=0;i<FLOORS.length;i++){
      var f = FLOORS[i];
      try{
        var res = await window.storage.get(keyFor(f), true);
        state.data[f] = res ? JSON.parse(res.value) : [];
      }catch(e){
        state.data[f] = [];
      }
    }
    state.loaded = true;
  }

  async function saveFloor(floor){
    try{
      var res = await window.storage.set(keyFor(floor), JSON.stringify(state.data[floor]), true);
      if(!res) throw new Error('save failed');
      return true;
    }catch(e){
      return false;
    }
  }

  function renderTabs(){
    var el = document.getElementById('floorTabs');
    el.innerHTML = '';
    FLOORS.forEach(function(f){
      var count = state.data[f].length;
      var btn = document.createElement('div');
      btn.className = 'floor-tab' + (state.floor===f ? ' active' : '');
      btn.innerHTML = '<span class="fnum">'+f+'</span><span class="fcount">'+count+' pt'+(count===1?'':'s')+'</span>';
      btn.onclick = function(){ state.floor = f; render(); };
      el.appendChild(btn);
    });
  }

  function renderRecord(){
    var rooms = state.data[state.floor];
    var isFirst = rooms.length === 0;
    var container = document.createElement('div');

    var panel = document.createElement('div');
    panel.className = 'panel';

    var roomField = document.createElement('div');
    roomField.className = 'field';
    roomField.innerHTML = '<span class="field-label">Room number</span>' +
      '<input type="text" id="roomInput" placeholder="e.g. 101" autocomplete="off">';
    panel.appendChild(roomField);

    var stepsField = document.createElement('div');
    stepsField.className = 'field';
    if (isFirst){
      stepsField.innerHTML = '<span class="field-label">Steps from last room</span>' +
        '<div class="start-note">Start point &middot; 0 steps</div>';
    } else {
      stepsField.innerHTML = '<span class="field-label">Steps from last room</span>' +
        '<input type="number" id="stepsInput" placeholder="e.g. 14" min="0" inputmode="numeric">';
    }
    panel.appendChild(stepsField);

    var addBtn = document.createElement('button');
    addBtn.className = 'add-btn';
    addBtn.textContent = 'Add room';
    panel.appendChild(addBtn);

    var errMsg = document.createElement('div');
    errMsg.className = 'err';
    panel.appendChild(errMsg);

    addBtn.onclick = async function(){
      var roomInput = document.getElementById('roomInput');
      var roomVal = roomInput.value.trim();
      if (!roomVal){
        errMsg.textContent = 'Enter a room number first.';
        return;
      }
      var stepsVal = 0;
      if (!isFirst){
        var stepsInput = document.getElementById('stepsInput');
        stepsVal = parseInt(stepsInput.value, 10);
        if (isNaN(stepsVal) || stepsVal < 0){
          errMsg.textContent = 'Enter the step count from the last room.';
          return;
        }
      }
      errMsg.textContent = '';
      addBtn.disabled = true;
      addBtn.textContent = 'Saving\u2026';
      state.data[state.floor].push({ id: uid(), room: roomVal, steps: stepsVal, ts: Date.now() });
      var ok = await saveFloor(state.floor);
      if (!ok){
        state.data[state.floor].pop();
        errMsg.textContent = 'Could not save. Try again.';
        addBtn.disabled = false;
        addBtn.textContent = 'Add room';
        return;
      }
      render();
    };

    container.appendChild(panel);

    var logTitle = document.createElement('div');
    logTitle.className = 'log-title';
    logTitle.textContent = 'Floor ' + state.floor + ' log \u2014 ' + rooms.length + ' room' + (rooms.length===1?'':'s');
    container.appendChild(logTitle);

    if (rooms.length === 0){
      var empty = document.createElement('div');
      empty.className = 'empty-state panel';
      empty.textContent = 'No rooms logged on this floor yet.';
      container.appendChild(empty);
    } else {
      var listPanel = document.createElement('div');
      listPanel.className = 'panel';
      listPanel.style.padding = '4px 12px';
      rooms.forEach(function(r, idx){
        var row = document.createElement('div');
        row.className = 'log-row';
        var stepsLabel = idx === 0 ? 'START POINT' : (r.steps + ' steps from prev');
        row.innerHTML =
          '<span class="seq">'+String(idx+1).padStart(2,'0')+'</span>' +
          '<div class="rinfo"><div class="rname">Room '+escapeHtml(r.room)+'</div>' +
          '<div class="rsteps">'+stepsLabel+'</div></div>' +
          '<button class="del-btn" aria-label="Delete room">\u2715</button>';
        row.querySelector('.del-btn').onclick = async function(){
          var removed = state.data[state.floor].splice(idx,1)[0];
          var ok = await saveFloor(state.floor);
          if (!ok){
            state.data[state.floor].splice(idx,0,removed);
            return;
          }
          render();
        };
        listPanel.appendChild(row);
      });
      container.appendChild(listPanel);
    }

    return container;
  }

  function escapeHtml(s){
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }

  function renderMap(){
    var rooms = state.data[state.floor];
    var container = document.createElement('div');

    var legend = document.createElement('div');
    legend.className = 'map-legend';
    legend.innerHTML = '<span><span class="scale-line"></span>dashed = walking path, labeled in steps</span>' +
      '<span>' + rooms.length + ' node' + (rooms.length===1?'':'s') + '</span>';
    container.appendChild(legend);

    if (rooms.length === 0){
      var empty = document.createElement('div');
      empty.className = 'empty-state panel';
      empty.textContent = 'No rooms logged yet \u2014 switch to Record to start.';
      container.appendChild(empty);
      return container;
    }

    var scrollWrap = document.createElement('div');
    scrollWrap.className = 'map-scroll';
    scrollWrap.innerHTML = buildSvg(rooms);
    container.appendChild(scrollWrap);
    return container;
  }

  function buildSvg(rooms){
    var ROW_SIZE = 5;
    var ROW_HEIGHT = 130;
    var NODE_R = 22;
    var PAD_X = 60;
    var PAD_Y = 55;
    var MIN_GAP = 90;
    var MAX_GAP = 230;
    var PX_PER_STEP = 3.2;

    var rowCount = Math.ceil(rooms.length / ROW_SIZE);
    var positions = [];
    var runningMaxX = PAD_X;

    for (var row=0; row<rowCount; row++){
      var dir = (row % 2 === 0) ? 1 : -1;
      var startIdx = row * ROW_SIZE;
      var endIdx = Math.min(startIdx + ROW_SIZE, rooms.length);
      var y = PAD_Y + row * ROW_HEIGHT;
      var x = (dir === 1) ? PAD_X : runningMaxX;
      for (var i=startIdx; i<endIdx; i++){
        var posInRow = i - startIdx;
        if (posInRow > 0){
          var gap = Math.max(MIN_GAP, Math.min(MAX_GAP, rooms[i].steps * PX_PER_STEP));
          x = x + dir * gap;
        }
        positions.push({x:x, y:y, room:rooms[i]});
        if (x > runningMaxX) runningMaxX = x;
      }
    }

    var width = runningMaxX + PAD_X + NODE_R;
    var height = PAD_Y + (rowCount-1) * ROW_HEIGHT + PAD_Y;

    var svg = '<svg viewBox="0 0 '+width+' '+height+'" width="'+width+'" height="'+height+'" xmlns="http://www.w3.org/2000/svg" style="display:block;min-width:100%;">';

    for (var i=1;i<positions.length;i++){
      var a = positions[i-1], b = positions[i];
      var midx = (a.x+b.x)/2, midy = (a.y+b.y)/2;
      svg += '<line x1="'+a.x+'" y1="'+a.y+'" x2="'+b.x+'" y2="'+b.y+'" stroke="#5B9BD5" stroke-width="2" stroke-dasharray="6,5" opacity="0.85"/>';
      svg += '<rect x="'+(midx-18)+'" y="'+(midy-11)+'" width="36" height="16" fill="#0B1B30" stroke="#2E5A85" stroke-width="1"/>';
      svg += '<text x="'+midx+'" y="'+(midy+1)+'" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10" fill="#7E97B2">'+b.room.steps+'</text>';
    }

    positions.forEach(function(p, i){
      var isStart = i===0;
      var fill = isStart ? '#FF5A1F' : '#0F2340';
      var stroke = isStart ? '#FF5A1F' : '#5B9BD5';
      var textFill = isStart ? '#1A0A03' : '#C9D8E8';
      svg += '<circle cx="'+p.x+'" cy="'+p.y+'" r="'+NODE_R+'" fill="'+fill+'" stroke="'+stroke+'" stroke-width="2"/>';
      svg += '<text x="'+p.x+'" y="'+(p.y+4)+'" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-weight="600" font-size="12" fill="'+textFill+'">'+escapeXml(p.room.room)+'</text>';
      if (isStart){
        svg += '<text x="'+p.x+'" y="'+(p.y+NODE_R+16)+'" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="9" letter-spacing="1" fill="#FF5A1F">START</text>';
      }
    });

    svg += '</svg>';
    return svg;
  }

  function escapeXml(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function render(){
    renderTabs();
    var content = document.getElementById('content');
    content.innerHTML = '';
    if (!state.loaded){
      content.innerHTML = '<div class="loading">LOADING SURVEY DATA&hellip;</div>';
      return;
    }
    if (state.mode === 'record'){
      content.appendChild(renderRecord());
    } else {
      content.appendChild(renderMap());
    }
  }

  document.getElementById('btnRecord').onclick = function(){
    state.mode = 'record';
    document.getElementById('btnRecord').classList.add('active');
    document.getElementById('btnMap').classList.remove('active');
    render();
  };
  document.getElementById('btnMap').onclick = function(){
    state.mode = 'map';
    document.getElementById('btnMap').classList.add('active');
    document.getElementById('btnRecord').classList.remove('active');
    render();
  };
  document.getElementById('resetBtn').onclick = async function(){
    if (!confirm('Clear all logged rooms for floor ' + state.floor + '? This cannot be undone.')) return;
    state.data[state.floor] = [];
    await saveFloor(state.floor);
    render();
  };

  loadAll().then(render);
})();
</script>
</body>
</html>
